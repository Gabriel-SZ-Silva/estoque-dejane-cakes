# Sistema completo: banco MySQL, aplicação no Tomcat e Caddy (HTTPS automático).
# Uso no servidor:  docker compose up -d --build
# As senhas e o endereço ficam no arquivo .env (copie de .env.exemplo).

services:
  banco:
    image: mysql:8.4
    restart: unless-stopped
    # Fuso de Brasília para a data e hora do histórico.
    command: ["--default-time-zone=-03:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_SENHA_ROOT:?defina DB_SENHA_ROOT no arquivo .env}
      MYSQL_DATABASE: dejane_cakes_db
      MYSQL_USER: dejane
      MYSQL_PASSWORD: ${DB_SENHA:?defina DB_SENHA no arquivo .env}
    volumes:
      - dados-mysql:/var/lib/mysql
      # Cria as tabelas na primeira vez que o banco sobe.
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://banco:3306/dejane_cakes_db
      DB_USUARIO: dejane
      DB_SENHA: ${DB_SENHA}
      CODIGO_INSTALACAO: ${CODIGO_INSTALACAO:?defina CODIGO_INSTALACAO no arquivo .env}
      # Fuso de Brasília para "hoje" (validade) e para o Java.
      TZ: America/Sao_Paulo

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no arquivo .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dados-caddy:/data
      - config-caddy:/config

volumes:
  dados-mysql:
  dados-caddy:
  config-caddy:
